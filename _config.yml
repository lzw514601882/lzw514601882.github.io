# Site settings
title: "Xin Yi"
name: "Xin Yi"
description: "Associate Professor, Peking University"
url: "https://yourname.github.io"   # ← 修改为你的域名
baseurl: ""                          # 根目录站点保持空字符串
repository: "yourname/yourname.github.io"  # ← 修改为你的仓库名

# Build settings
markdown: kramdown
highlighter: rouge
theme: "academicpages"   # 如果你是从 academicpages 模板fork的，保持此项
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jemoji

permalink: /:categories/:title/

# Author (linked to _data/authors.yml)
author:
  name: "Xin Yi"
  avatar: "images/profile.jpg"   # 放一张头像到 /images/profile.jpg（可空）
  bio: "Associate Professor, Peking University"
  location: "Beijing, China"
  email: "xyi@pku.edu.cn"
  uri: "https://sites.google.com/view/yixin1983"
  github: your-github-username   # ← 可填你的 GitHub 用户名
  google_scholar:               # ← 若有Google Scholar ID可填
  ORCID:                        # ← 若有ORCID可填
  # 其他社交可按需添加：twitter, linkedin, researchgate, etc.

# Collections (AcademicPages默认集合)
collections:
  publications:
    output: true
    permalink: /publications/:path/
  talks:
    output: true
    permalink: /talks/:path/
  teaching:
    output: true
    permalink: /teaching/:path/
  # pages 由 Jekyll 自动处理

# Defaults for Markdown pages & posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: false
      comments: false
      share: false
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true

# Analytics (可选)
google_analytics: ""      # UA-XXXX 或 G-XXXX；没有就留空
